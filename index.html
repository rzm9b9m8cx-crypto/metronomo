<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metrônomo Mecânico Realista</title>

<style>

:root{
    --bg:#0b0b0c;
    --wood1:#5a3d26;
    --wood2:#2f1d12;
    --metal:#d2d2d2;
    --gold:#c8a96b;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    height:100vh;
    background:
        radial-gradient(circle at top,#1a1a1a,#050505 70%);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-family:Arial, Helvetica, sans-serif;
    color:white;
    overflow:hidden;
}

/* ========================= */
/* METRÔNOMO */
/* ========================= */

.metronome{
    position:relative;
    width:220px;
    height:420px;
    margin-bottom:40px;
}

/* Corpo */

.body{
    position:absolute;
    inset:0;

    clip-path:polygon(28% 0,72% 0,100% 100%,0 100%);

    background:
        linear-gradient(
            145deg,
            #6d492d 0%,
            #3e2617 40%,
            #22140c 100%
        );

    border:2px solid rgba(255,255,255,0.05);

    box-shadow:
        inset 0 0 40px rgba(255,255,255,0.04),
        inset 0 -30px 60px rgba(0,0,0,0.8),
        0 25px 60px rgba(0,0,0,0.9);

}

/* Reflexo */

.body::after{
    content:"";
    position:absolute;
    left:20%;
    top:4%;
    width:20%;
    height:80%;
    background:linear-gradient(
        to right,
        rgba(255,255,255,0.10),
        transparent
    );
    transform:skewX(-10deg);
    filter:blur(3px);
}

/* Escala */

.scale{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    top:40px;

    width:42px;
    height:300px;

    background:
        linear-gradient(
            to right,
            #d6d1c8,
            #f0ece4,
            #c8c1b7
        );

    border-radius:4px;

    box-shadow:
        inset 0 0 8px rgba(0,0,0,0.4);

    display:flex;
    flex-direction:column;
    justify-content:space-between;
    align-items:center;

    padding:12px 0;

    z-index:1;
}

.scale span{
    color:#111;
    font-size:12px;
    font-weight:bold;
}

/* Pêndulo */

.pendulum{
    position:absolute;
    left:50%;
    bottom:36px;

    width:6px;
    height:310px;

    transform-origin:bottom center;

    z-index:5;
}

/* Barra */

.rod{
    position:absolute;
    width:100%;
    height:100%;

    background:
        linear-gradient(
            to right,
            #777,
            #fff,
            #777
        );

    border-radius:10px;
}

/* Peso */

.weight{
    position:absolute;
    left:50%;
    transform:translateX(-50%);

    width:42px;
    height:24px;

    border-radius:5px;

    background:
        linear-gradient(
            to bottom,
            #e4e4e4,
            #777
        );

    border:1px solid rgba(255,255,255,0.3);

    box-shadow:
        0 4px 8px rgba(0,0,0,0.6),
        inset 0 2px 2px rgba(255,255,255,0.3);
}

/* Pivô */

.pivot{
    position:absolute;
    left:50%;
    bottom:25px;

    transform:translateX(-50%);

    width:22px;
    height:22px;

    border-radius:50%;

    background:
        radial-gradient(circle at 30% 30%,#fff,#666);

    z-index:10;

    box-shadow:
        0 0 10px rgba(255,255,255,0.15),
        0 3px 8px rgba(0,0,0,0.8);
}

/* ========================= */
/* CONTROLES */
/* ========================= */

.controls{
    width:320px;
    padding:24px;

    border-radius:20px;

    background:
        linear-gradient(
            180deg,
            #1c1c1c,
            #101010
        );

    border:1px solid rgba(255,255,255,0.06);

    box-shadow:
        0 20px 50px rgba(0,0,0,0.8);
}

.bpm{
    text-align:center;
    font-size:58px;
    font-weight:900;
    letter-spacing:2px;
}

.label{
    text-align:center;
    color:#999;
    margin-bottom:22px;
}

.row{
    display:flex;
    gap:12px;
    align-items:center;
}

button{
    border:none;
    background:#2c2c2c;
    color:white;
    width:50px;
    height:50px;
    border-radius:12px;
    font-size:22px;
    cursor:pointer;

    transition:0.15s;
}

button:hover{
    transform:translateY(-2px);
}

button:active{
    transform:scale(0.95);
}

input[type=range]{
    flex:1;
}

.play{
    width:100%;
    margin-top:20px;
    height:56px;

    background:
        linear-gradient(
            180deg,
            #2e8f45,
            #216634
        );

    font-size:18px;
    font-weight:bold;
}

.play.stop{
    background:
        linear-gradient(
            180deg,
            #c53a3a,
            #7c1f1f
        );
}

</style>
</head>
<body>

<div class="metronome">

    <div class="body"></div>

    <div class="scale">
        <span>40</span>
        <span>60</span>
        <span>72</span>
        <span>84</span>
        <span>100</span>
        <span>120</span>
        <span>160</span>
        <span>208</span>
    </div>

    <div class="pendulum" id="pendulum">

        <div class="rod"></div>

        <div class="weight" id="weight"></div>

    </div>

    <div class="pivot"></div>

</div>

<div class="controls">

    <div class="bpm" id="bpmValue">76</div>
    <div class="label">BATIMENTOS POR MINUTO</div>

    <div class="row">

        <button id="minus">−</button>

        <input type="range"
               min="40"
               max="208"
               value="76"
               id="slider">

        <button id="plus">+</button>

    </div>

    <button class="play" id="playBtn">
        INICIAR
    </button>

</div>

<script>

let bpm = 76;
let playing = false;

const slider = document.getElementById("slider");
const bpmValue = document.getElementById("bpmValue");
const playBtn = document.getElementById("playBtn");
const pendulum = document.getElementById("pendulum");
const weight = document.getElementById("weight");

let audioCtx;

let startTime = 0;

let animationFrame;

function updateWeight(){

    const min = 40;
    const max = 208;

    const normalized =
        (bpm - min) / (max - min);

    const pos =
        220 - (normalized * 180);

    weight.style.top = `${pos}px`;
}

function updateBpm(v){

    bpm = Math.max(40, Math.min(208, v));

    bpmValue.textContent = bpm;

    slider.value = bpm;

    updateWeight();
}

/* ========================= */
/* SOM MECÂNICO REAL */
/* ========================= */

function clickSound(time){

    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();

    const gain = audioCtx.createGain();

    osc1.type = "triangle";
    osc2.type = "square";

    osc1.frequency.setValueAtTime(1800,time);
    osc2.frequency.setValueAtTime(900,time);

    osc1.frequency.exponentialRampToValueAtTime(600,time+0.02);
    osc2.frequency.exponentialRampToValueAtTime(400,time+0.02);

    gain.gain.setValueAtTime(0.0001,time);

    gain.gain.exponentialRampToValueAtTime(0.4,time+0.001);

    gain.gain.exponentialRampToValueAtTime(0.0001,time+0.03);

    osc1.connect(gain);
    osc2.connect(gain);

    gain.connect(audioCtx.destination);

    osc1.start(time);
    osc2.start(time);

    osc1.stop(time+0.03);
    osc2.stop(time+0.03);
}

/* ========================= */
/* CLOCK PRECISO */
/* ========================= */

let nextBeatTime = 0;

function scheduler(){

    const interval = 60 / bpm;

    while(nextBeatTime < audioCtx.currentTime + 0.1){

        clickSound(nextBeatTime);

        nextBeatTime += interval;
    }

    if(playing){
        setTimeout(scheduler,10);
    }
}

/* ========================= */
/* MOVIMENTO REAL */
/* ========================= */

function animate(){

    if(!playing) return;

    const now =
        audioCtx.currentTime - startTime;

    const freq =
        bpm / 60;

    const angle =
        Math.sin(now * Math.PI * freq)
        * 32;

    pendulum.style.transform =
        `rotate(${angle}deg)`;

    animationFrame =
        requestAnimationFrame(animate);
}

/* ========================= */

function toggle(){

    if(!audioCtx){

        audioCtx =
            new(window.AudioContext ||
            window.webkitAudioContext)();
    }

    playing = !playing;

    if(playing){

        startTime = audioCtx.currentTime;

        nextBeatTime =
            audioCtx.currentTime;

        scheduler();

        animate();

        playBtn.textContent = "PARAR";

        playBtn.classList.add("stop");

    }else{

        cancelAnimationFrame(animationFrame);

        pendulum.style.transform =
            "rotate(0deg)";

        playBtn.textContent = "INICIAR";

        playBtn.classList.remove("stop");
    }
}

/* ========================= */

slider.addEventListener("input",e=>{
    updateBpm(+e.target.value);
});

document
.getElementById("minus")
.onclick=()=>updateBpm(bpm-1);

document
.getElementById("plus")
.onclick=()=>updateBpm(bpm+1);

playBtn.onclick = toggle;

updateWeight();

</script>

</body>
</html>

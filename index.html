<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metrônomo 76 BPM</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #4CAF50;
            --accent-hover: #45a049;
            --border-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }

        .metronome-container {
            background-color: var(--panel-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 300px;
            border: 1px solid var(--border-color);
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
            color: #fff;
            margin-bottom: 30px;
        }

        .bpm-display {
            font-size: 64px;
            font-weight: bold;
            margin: 20px 0;
            color: var(--accent-color);
        }

        .bpm-label {
            font-size: 18px;
            color: #888;
            margin-bottom: 20px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            margin: 20px 0;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            margin-top: -10px;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: var(--border-color);
            border-radius: 3px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
        }

        button {
            background-color: #333;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 15px 20px;
            font-size: 20px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }

        button:hover {
            background-color: #444;
        }

        #play-btn {
            background-color: var(--accent-color);
            flex-grow: 1;
            margin: 0 15px;
            font-weight: bold;
            font-size: 20px;
        }

        #play-btn:hover {
            background-color: var(--accent-hover);
        }

        .indicator-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .dot {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background-color: #333;
            transition: background-color 0.1s;
        }

        .dot.active {
            background-color: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-color);
        }

        .dot.active.first-beat {
            background-color: #ff5252;
            box-shadow: 0 0 10px #ff5252;
        }

    </style>
</head>
<body>

    <div class="metronome-container">
        <h1>Metrônomo Digital</h1>
        
        <div class="indicator-container" id="indicators">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <div class="bpm-display"><span id="bpm-value">76</span></div>
        <div class="bpm-label">BPM</div>

        <input type="range" id="bpm-slider" min="30" max="250" value="76">

        <div class="controls">
            <button id="minus-btn">-</button>
            <button id="play-btn">INICIAR</button>
            <button id="plus-btn">+</button>
        </div>
    </div>

    <script>
        // Variáveis de Estado
        let bpm = 76;
        let isPlaying = false;
        let beatsPerMeasure = 4;
        
        // Elementos do DOM
        const bpmValue = document.getElementById('bpm-value');
        const bpmSlider = document.getElementById('bpm-slider');
        const playBtn = document.getElementById('play-btn');
        const minusBtn = document.getElementById('minus-btn');
        const plusBtn = document.getElementById('plus-btn');
        const dots = document.querySelectorAll('.dot');

        // Variáveis do Web Audio API (Para precisão de tempo)
        let audioContext;
        let currentBeat = 0;
        let nextNoteTime = 0.0;
        let timerWorker = null;
        let lookahead = 25; // Milissegundos que o timer acorda
        let scheduleAheadTime = 0.1; // Quão longe no futuro agendar o áudio (segundos)

        // Função para criar o som de "Click" realista
        function playClick(time, isFirstBeat) {
            // Cria os nós de áudio
            const osc = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            osc.connect(gainNode);
            gainNode.connect(audioContext.destination);

            // Configuração do som (Timbre)
            if (isFirstBeat) {
                // Som mais agudo e forte no primeiro tempo (Ping)
                osc.frequency.value = 1200;
            } else {
                // Som mais grave nos outros tempos (Tak)
                osc.frequency.value = 800;
            }

            // Envelope de volume (Ataque rápido, queda rápida para parecer mecânico)
            gainNode.gain.setValueAtTime(1, time);
            gainNode.gain.exponentialRampToValueAtTime(0.001, time + 0.05);

            // Inicia e para o som
            osc.start(time);
            osc.stop(time + 0.05);

            // Sincroniza a interface visual (bolinhas) com o tempo do áudio
            setTimeout(() => {
                updateVisuals(isFirstBeat);
            }, (time - audioContext.currentTime) * 1000);
        }

        // Atualiza as luzes visuais
        function updateVisuals(isFirstBeat) {
            dots.forEach(dot => dot.className = 'dot'); // Limpa todos
            if (isFirstBeat) {
                dots[currentBeat].classList.add('active', 'first-beat');
            } else {
                dots[currentBeat].classList.add('active');
            }
        }

        // Calcula quando será o próximo batimento
        function nextNote() {
            const secondsPerBeat = 60.0 / bpm;
            nextNoteTime += secondsPerBeat;
            
            // Avança o contador de batidas (0, 1, 2, 3 para compasso 4/4)
            currentBeat++;
            if (currentBeat === beatsPerMeasure) {
                currentBeat = 0;
            }
        }

        // Função principal que agenda os sons
        function scheduler() {
            // Enquanto o próximo batimento estiver dentro do nosso "radar" de tempo futuro
            while (nextNoteTime < audioContext.currentTime + scheduleAheadTime) {
                playClick(nextNoteTime, currentBeat === 0);
                nextNote();
            }
            timerWorker = setTimeout(scheduler, lookahead);
        }

        // Inicia ou para o metrônomo
        function toggleMetronome() {
            // Navegadores exigem que o contexto de áudio seja criado após uma interação do usuário
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }

            isPlaying = !isPlaying;

            if (isPlaying) {
                currentBeat = 0;
                nextNoteTime = audioContext.currentTime + 0.05; // Começa quase imediatamente
                scheduler();
                playBtn.textContent = "PARAR";
                playBtn.style.backgroundColor = "#ff5252"; // Fica vermelho ao parar
            } else {
                clearTimeout(timerWorker);
                playBtn.textContent = "INICIAR";
                playBtn.style.backgroundColor = "var(--accent-color)";
                dots.forEach(dot => dot.className = 'dot'); // Limpa as luzes
            }
        }

        // Atualiza a interface e a variável BPM
        function updateBpm(newBpm) {
            // Limites de segurança
            if (newBpm < 30) newBpm = 30;
            if (newBpm > 250) newBpm = 250;
            
            bpm = newBpm;
            bpmValue.textContent = bpm;
            bpmSlider.value = bpm;
        }

        // Event Listeners (Ações do usuário)
        playBtn.addEventListener('click', toggleMetronome);

        bpmSlider.addEventListener('input', (e) => {
            updateBpm(parseInt(e.target.value));
        });

        minusBtn.addEventListener('click', () => {
            updateBpm(bpm - 1);
        });

        plusBtn.addEventListener('click', () => {
            updateBpm(bpm + 1);
        });

    </script>
</body>
</html>
